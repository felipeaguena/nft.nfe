<!-- Cabeçalho da Página no Padrão Unificado -->
<div class="nft-page-header mb-3" style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px;">
  <div>
    <h1 class="nft-page-title" style="font-size: 22px; font-weight: 700; color: #0F172A; margin: 0; display: flex; align-items: center; gap: 8px;">
      <span>Editor &amp; Gerador NF-e</span>
      <span class="badge {{ editor_cfg.badge_class }} font-monospace bg-info-subtle text-info fw-bold" style="font-size: 11px; padding: 4px 8px;">{{ editor_cfg.badge_titulo }}</span>
    </h1>
    <p class="nft-page-subtitle" style="font-size: 13px; color: #64748B; margin: 3px 0 0 0;">{{ editor_cfg.subtitulo }}</p>
  </div>
  <div class="d-flex align-items-center gap-2">
    <button class="nft-btn-secondary fw-bold btn-header-round btn-analisar-rascunho" onclick="analisarRascunho()" data-bs-toggle="tooltip" data-bs-placement="bottom" title="{{ editor_cfg.tooltip_analisar }}" aria-label="{{ editor_cfg.tooltip_analisar }}" type="button">
      <i data-lucide="shield-check"></i>
    </button>
    <button class="nft-btn-secondary fw-bold btn-header-round btn-espelho-fiscal" onclick="abrirEspelhoFiscal()" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Visualizar Espelho do Documento Fiscal (Resumo de Configurações - Atalho: Alt+E)" aria-label="Visualizar Espelho do Documento Fiscal" type="button" style="border-color: #93C5FD; color: #1D4ED8; background: #EFF6FF;">
      <i data-lucide="file-search" style="color: #2563EB;"></i>
    </button>
    <button class="nft-btn-primary fw-bold btn-header-round btn-gerar-xml" onclick="generateXML()" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Gerar e Baixar Arquivo XML da NF-e" aria-label="Gerar e Baixar Arquivo XML da NF-e" type="button">
      <i data-lucide="download"></i>
    </button>
  </div>
</div>

<!-- Upload & Rascunhos Card -->
<div class="card mb-3 shadow-sm border p-3 d-flex flex-column gap-2" style="border-radius: 16px;">
  <div class="row g-2 align-items-center">
    {% if editor_modo == 'nova_nf' %}
      <!-- 1. Referência Interna (Nova NF) -->
      <div class="col-xl-6 col-lg-6 col-md-6 col-12">
        <div class="nft-notch-field mb-0">
          <label class="nft-notch-label">Referência Interna do Documento</label>
          <span class="nft-notch-icon"><i data-lucide="tag" style="width: 15px; height: 15px; stroke-width: 1.75px;"></i></span>
          <input autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-form-type="other" readonly onfocus="this.removeAttribute('readonly')" class="nft-notch-input font-monospace" id="referenciaInterna" name="referencia_interna_doc" oninput="atualizarReferenciaRascunho(this.value)" placeholder="Ex: NOTA-2026/001, PEDIDO-1050, PO-998" type="text"/>
        </div>
      </div>
      <!-- 2. Botões de Ação -->
      <div class="col-xl-6 col-lg-6 col-md-6 col-12 d-flex align-items-center gap-2">
        <button class="nft-btn-secondary w-50 fw-bold d-flex align-items-center justify-content-center gap-2 flex-grow-1 text-nowrap" onclick="abrirModalSalvarRascunho()" title="Salvar Rascunho para continuar editando depois">
          <i data-lucide="save" style="width: 16px; height: 16px;"></i>
          <span>Salvar Rascunho</span>
        </button>
        <button class="nft-btn-secondary w-50 fw-bold d-flex align-items-center justify-content-center gap-2 flex-grow-1 text-nowrap" onclick="limparSessaoTemporariaComConfirmacao()" title="Limpar dados temporários desta página e iniciar uma nota em branco" type="button">
          <i data-lucide="rotate-ccw" style="width: 16px; height: 16px;"></i>
          <span>Nova Nota</span>
        </button>
      </div>
    {% elif editor_modo == 'di_duimp' %}
      <!-- 1. Referência Interna (DI / DUIMP) -->
      <div class="col-xl-2 col-lg-2 col-md-6 col-12">
        <div class="nft-notch-field mb-0">
          <label class="nft-notch-label">Referência Interna</label>
          <span class="nft-notch-icon"><i data-lucide="tag" style="width: 15px; height: 15px; stroke-width: 1.75px;"></i></span>
          <input autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-form-type="other" readonly onfocus="this.removeAttribute('readonly')" class="nft-notch-input font-monospace" id="referenciaInterna" name="referencia_interna_doc" oninput="atualizarReferenciaRascunho(this.value)" placeholder="Ex: REF-2026/001" type="text"/>
        </div>
      </div>
      <!-- 2. Arquivo XML DI / DUIMP -->
      <div class="col-xl-3 col-lg-3 col-md-6 col-12">
        <div class="nft-notch-field mb-0">
          <label class="nft-notch-label">Arquivo DI / DUIMP (XML)</label>
          <input accept=".xml" class="form-control" id="xmlFileInput" type="file"/>
        </div>
      </div>
      <!-- 3. Processar XML & 4. Puxar DUIMP Online -->
      <div class="col-xl-3 col-lg-3 col-md-4 col-12 d-flex align-items-center gap-2">
        <button class="nft-btn-primary w-50 fw-bold d-flex align-items-center justify-content-center gap-2 flex-grow-1 text-nowrap" onclick="uploadXML()" type="button" title="Processar arquivo XML de DI ou DUIMP do computador">
          <i data-lucide="upload" style="width: 16px; height: 16px;"></i>
          <span>Processar XML</span>
        </button>
        <button class="nft-btn-primary w-50 fw-bold d-flex align-items-center justify-content-center gap-2 flex-grow-1 text-nowrap" onclick="abrirModalImportarDuimp()" type="button" title="Puxar dados oficiais da DUIMP por número (Portal Único Siscomex)" style="background-color: #059669; border-color: #059669;">
          <i data-lucide="cloud-download" style="width: 16px; height: 16px;"></i>
          <span>Puxar DUIMP</span>
        </button>
      </div>
      <!-- 5. Salvar / Nova Nota -->
      <div class="col-xl-3 col-lg-3 col-md-4 col-12 d-flex align-items-center gap-2">
        <button class="nft-btn-secondary w-50 fw-bold d-flex align-items-center justify-content-center gap-2 flex-grow-1 text-nowrap" onclick="abrirModalSalvarRascunho()" title="Salvar Rascunho para continuar editando depois">
          <i data-lucide="save" style="width: 16px; height: 16px;"></i>
          <span>Salvar</span>
        </button>
        <button class="nft-btn-secondary w-50 fw-bold d-flex align-items-center justify-content-center gap-2 flex-grow-1 text-nowrap" onclick="limparSessaoTemporariaComConfirmacao()" title="Limpar dados temporários desta página e iniciar uma nota em branco" type="button">
          <i data-lucide="rotate-ccw" style="width: 16px; height: 16px;"></i>
          <span>Nova Nota</span>
        </button>
      </div>
    {% else %}
      <!-- 1. Referência Interna (XML Rascunho) -->
      <div class="col-xl-3 col-lg-3 col-md-6 col-12">
        <div class="nft-notch-field mb-0">
          <label class="nft-notch-label">Referência Interna</label>
          <span class="nft-notch-icon"><i data-lucide="tag" style="width: 15px; height: 15px; stroke-width: 1.75px;"></i></span>
          <input autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-form-type="other" readonly onfocus="this.removeAttribute('readonly')" class="nft-notch-input font-monospace" id="referenciaInterna" name="referencia_interna_doc" oninput="atualizarReferenciaRascunho(this.value)" placeholder="Ex: NFT2600292-I" type="text"/>
        </div>
      </div>
      <!-- 2. Arquivo XML de Modelo -->
      <div class="col-xl-4 col-lg-4 col-md-6 col-12">
        <div class="nft-notch-field mb-0">
          <label class="nft-notch-label">Arquivo XML de Modelo (Espelho)</label>
          <input accept=".xml" class="form-control" id="xmlFileInput" type="file"/>
        </div>
      </div>
      <!-- 3. Processar XML -->
      <div class="col-xl-2 col-lg-2 col-md-4 col-12">
        <button class="nft-btn-primary w-100 fw-bold d-flex align-items-center justify-content-center gap-2 text-nowrap" onclick="uploadXML()" type="button">
          <i data-lucide="upload" style="width: 16px; height: 16px;"></i>
          <span>Processar XML</span>
        </button>
      </div>
      <!-- 4. Salvar / Nova Nota -->
      <div class="col-xl-3 col-lg-3 col-md-8 col-12 d-flex align-items-center gap-2">
        <button class="nft-btn-secondary w-50 fw-bold d-flex align-items-center justify-content-center gap-2 flex-grow-1 text-nowrap" onclick="abrirModalSalvarRascunho()" title="Salvar Rascunho para continuar editando depois">
          <i data-lucide="save" style="width: 16px; height: 16px;"></i>
          <span>Salvar</span>
        </button>
        <button class="nft-btn-secondary w-50 fw-bold d-flex align-items-center justify-content-center gap-2 flex-grow-1 text-nowrap" onclick="limparSessaoTemporariaComConfirmacao()" title="Limpar dados temporários desta página e iniciar uma nota em branco" type="button">
          <i data-lucide="rotate-ccw" style="width: 16px; height: 16px;"></i>
          <span>Nova Nota</span>
        </button>
      </div>
    {% endif %}
  </div>

  <!-- Linha Inferior com Indicadores de Status e Origem -->
  <div class="row g-2 pt-2">
    <div class="col-6 d-flex flex-column align-items-start gap-1 small">
      <span class="text-muted">Status do Documento:</span>
      <div class="d-flex align-items-center gap-1">
        <span class="badge bg-info-subtle text-info fw-bold" id="status-badge">{{ editor_cfg.status_inicial }}</span>
        <span class="badge d-none bg-info-subtle text-info fw-bold" id="rascunho-info-tag"></span>
      </div>
    </div>
    <div class="col-6 d-flex flex-column align-items-start gap-1 text-muted small font-monospace" id="rascunho-origem-indicator">
      <span>Módulo Ativo:</span>
      <span class="badge {{ editor_cfg.badge_class }} bg-info-subtle text-info fw-bold">{{ editor_cfg.nome_modulo }}</span>
    </div>
  </div>
</div>
