<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link href="/static/img/brand/nftlogo.webp" rel="icon" type="image/webp"/>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>{% block title %}NFT Logistics — Sistema NF-e{% endblock %}</title>
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  {% block vendor_css %}{% endblock %}
  <!-- NFT Design System Modular (Core -> Components -> Pages -> 3 Screen Layouts) -->
  <link href="/static/css/nft-app.css?v=5.0" rel="stylesheet"/>
  <!-- Theme Manager (aplica data-theme antes da pintura para evitar flash) -->
  <script src="/static/js/theme.js?v=5.0"></script>
  <!-- Lucide Icons & Core UI -->
  <script src="/static/js/lucide.min.js"></script>
  <script src="/static/js/core/nft-ui-factory.js?v=1.0"></script>
  <script src="/static/js/core/nft-tooltips.js?v=1.0"></script>
  <script src="/static/js/nft-dialogs.js?v=5.0"></script>
  <script defer src="/static/js/nft-sidebar.js?v=5.0"></script>
  <script defer src="/static/js/nft-shortcuts.js?v=1.0"></script>
  {% block extra_head %}{% endblock %}
</head>
<body class="has-sidebar {% block body_class %}{% endblock %}">
  {% include 'partials/sidebar.html' %}

  <div class="nft-main-wrapper" data-ui="app.layout.main-wrapper">
    {% include 'partials/topbar.html' %}

    <main class="nft-page-container" data-ui="{% block page_ui_id %}app.page.content{% endblock %}">
      {% block content %}{% endblock %}
    </main>
  </div>

  {% block modals %}{% endblock %}

  <!-- Bootstrap 5.3 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
